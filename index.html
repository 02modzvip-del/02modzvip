
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>02 MODZ VIP</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --cyan:#00eaff;
  --blue:#087bff;
  --dark:#020612;
}

body{
  min-height:100vh;
  font-family:Arial,sans-serif;
  background:var(--dark);
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow-x:hidden;
  padding:75px 15px 30px;
}

body::before{
  content:"";
  position:fixed;
  width:150vw;
  height:150vw;
  min-width:700px;
  min-height:700px;
  border-radius:50%;
  background:repeating-radial-gradient(
    circle,
    transparent 0 35px,
    #007bff55 37px 40px,
    transparent 43px 65px
  );
  animation:rotate 16s linear infinite;
  z-index:-2;
}

body::after{
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(ellipse at 50% 30%,#003d8055,transparent 60%),
    radial-gradient(ellipse at 50% 100%,#00d9ff22,transparent 50%);
  z-index:-1;
  pointer-events:none;
}

@keyframes rotate{
  from{transform:rotate(0deg) scale(1)}
  to{transform:rotate(360deg) scale(1.08)}
}

.topbar{
  position:absolute;
  top:18px;
  left:18px;
  right:18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.owner{
  border:1px solid var(--cyan);
  padding:10px 14px;
  border-radius:30px;
  color:var(--cyan);
  font-size:12px;
  font-weight:bold;
  box-shadow:0 0 15px #00eaff33;
}

.settings{
  width:43px;
  height:43px;
  border:1px solid var(--cyan);
  background:#06162a;
  color:var(--cyan);
  border-radius:13px;
  font-size:23px;
  cursor:pointer;
}

.card{
  width:100%;
  max-width:390px;
  padding:30px 22px;
  text-align:center;
  background:rgba(3,12,29,.94);
  border:1px solid #00cfff;
  border-radius:24px;
  box-shadow:
    0 0 22px #007bff44,
    inset 0 0 25px #007bff11;
  position:relative;
}

.logo{
  width:90px;
  height:90px;
  margin:0 auto 20px;
  border:2px solid var(--cyan);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:37px;
  font-weight:900;
  color:white;
  text-shadow:0 0 15px var(--cyan);
  box-shadow:0 0 25px #00d9ff66;
  animation:pulse 2s infinite alternate;
}

@keyframes pulse{
  from{box-shadow:0 0 10px #00d9ff44}
  to{box-shadow:0 0 30px #00d9ffaa}
}

h1{
  font-size:27px;
  letter-spacing:2px;
  margin-bottom:12px;
}

h1 span{color:var(--cyan)}

.subtitle{
  color:#8da9cc;
  font-size:12px;
  letter-spacing:3px;
  margin-bottom:28px;
}

input{
  width:100%;
  padding:16px;
  background:#061328;
  border:1px solid #087bff;
  border-radius:12px;
  color:white;
  font-size:15px;
  outline:none;
  margin-bottom:14px;
}

input:focus{
  border-color:var(--cyan);
  box-shadow:0 0 15px #00eaff33;
}

button{font-family:inherit}

.unlock{
  width:100%;
  padding:16px;
  background:linear-gradient(100deg,#086bff,#00d9ff);
  color:white;
  font-size:15px;
  font-weight:bold;
  letter-spacing:1px;
  border:0;
  border-radius:12px;
  cursor:pointer;
  box-shadow:0 0 20px #008cff55;
}

#message{
  min-height:18px;
  margin-top:12px;
  font-size:12px;
  color:var(--cyan);
}

.or{
  display:flex;
  align-items:center;
  gap:15px;
  margin:22px 0;
  color:#7da5d8;
  font-size:12px;
}

.or::before,.or::after{
  content:"";
  flex:1;
  height:1px;
  background:#164875;
}

.telegram{
  display:flex;
  align-items:center;
  gap:13px;
  padding:15px;
  border:1px solid #00bfff;
  border-radius:15px;
  text-decoration:none;
  color:white;
  transition:.2s;
}

.telegram:active{transform:scale(.97)}

.tg-icon{
  width:45px;
  height:45px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#079de0;
  border-radius:50%;
  font-size:23px;
}

.tg-text{
  flex:1;
  text-align:left;
}

.tg-text strong{display:block;font-size:15px}
.tg-text small{display:block;color:#88b8e8;margin-top:5px}

.arrow{color:var(--cyan);font-size:22px}

.footer{
  margin-top:25px;
  font-size:10px;
  letter-spacing:4px;
  color:#00cfff;
}

.popup{
  display:none;
  position:fixed;
  inset:0;
  background:#000b;
  z-index:10;
  align-items:center;
  justify-content:center;
  padding:25px;
}

.popup-box{
  width:100%;
  max-width:320px;
  padding:25px;
  text-align:center;
  background:#07152b;
  border:1px solid var(--cyan);
  border-radius:18px;
  box-shadow:0 0 30px #007bff55;
}

.popup-box h2{
  color:var(--cyan);
  margin-bottom:18px;
}

.popup-box p{
  margin:12px 0;
  color:white;
}

.close{
  width:100%;
  padding:12px;
  background:#087bff;
  color:white;
  border:0;
  border-radius:10px;
  margin-top:15px;
  cursor:pointer;
}

@media(max-height:650px){
  body{align-items:flex-start}
}
</style>
</head>

<body>

<div class="topbar">
  <div class="owner">♛ OWNER : @Stylex77</div>
  <button class="settings" id="settingsBtn"
    aria-label="Settings">⚙</button>
</div>

<main class="card">

  <div class="logo">02</div>

  <h1>02 MODZ <span>VIP</span></h1>
  <p class="subtitle">ENTER YOUR ACCESS KEY</p>

  <form id="keyForm">
    <input
      id="keyInput"
      type="password"
      placeholder="🔑 Enter your key..."
      autocomplete="off"
      required
    >

    <button class="unlock" type="submit">
      UNLOCK ACCESS &nbsp; ↗
    </button>
  </form>

  <div id="message" aria-live="polite"></div>

  <div class="or">OR JOIN US</div>

  <a class="telegram"
     href="https://t.me/Z4xbanmodz"
     target="_blank"
     rel="noopener noreferrer">

    <div class="tg-icon">➤</div>

    <div class="tg-text">
      <strong>Telegram</strong>
      <small>Join Our Channel</small>
    </div>

    <div class="arrow">→</div>
  </a>

  <div class="footer">02 MODZ • VIP ACCESS</div>

</main>

<div class="popup" id="settingsPopup">
  <div class="popup-box">
    <h2>⚙ SETTINGS</h2>
    <p>OWNER : <strong>@Stylex77</strong></p>
    <p>PROJECT : 02 MODZ VIP</p>
    <button class="close" id="closeBtn">CLOSE</button>
  </div>
</div>

<script>
const destination =
"https://dripwire.cc/config.php?key=2430986274&server=ind&tab=setup";

const form = document.getElementById("keyForm");
const keyInput = document.getElementById("keyInput");
const message = document.getElementById("message");

form.addEventListener("submit", function(e){
  e.preventDefault();

  const key = keyInput.value.trim();

  if(!key){
    message.textContent = "Please enter your key!";
    return;
  }

  message.textContent = "Connecting...";

  window.location.href = destination;
});

const popup = document.getElementById("settingsPopup");

document.getElementById("settingsBtn").onclick = function(){
  popup.style.display = "flex";
};

document.getElementById("closeBtn").onclick = function(){
  popup.style.display = "none";
};

popup.addEventListener("click", function(e){
  if(e.target === popup){
    popup.style.display = "none";
  }
});
</script>

</body>
</html>
